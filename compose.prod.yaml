services:
  content-pilot-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the server-side env file}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the server-side env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the server-side env file}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - content-pilot-prod-postgres-data:/var/lib/postgresql/data
    networks: [content-pilot-prod-network]

  content-pilot-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [content-pilot-prod-network]

  content-pilot-api:
    image: ${CONTENT_PILOT_IMAGE:?set CONTENT_PILOT_IMAGE to an immutable GHCR image tag}
    restart: unless-stopped
    command: uvicorn content_pilot.app:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      APP_NAME: ${APP_NAME:-ContentPilot}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Samara}
      POSTGRES_HOST: ${POSTGRES_HOST:-content-pilot-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the server-side env file}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the server-side env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the server-side env file}
      REDIS_HOST: ${REDIS_HOST:-content-pilot-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      PROXYAPI_API_KEY: ${PROXYAPI_API_KEY:-}
      PROXYAPI_BASE_URL: ${PROXYAPI_BASE_URL:-https://api.proxyapi.ru/v1}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-openai/gpt-4.1-mini}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-openai/gpt-image-1-mini}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      MEDIA_ROOT: /app/data/media
    depends_on:
      content-pilot-db:
        condition: service_healthy
    ports:
      - "${CONTENT_PILOT_BIND_ADDRESS:-127.0.0.1}:${CONTENT_PILOT_HOST_PORT:-8000}:8000"
    volumes:
      - content-pilot-prod-media:/app/data/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health').status == 200\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [content-pilot-prod-network]

  content-pilot-worker:
    image: ${CONTENT_PILOT_IMAGE:?set CONTENT_PILOT_IMAGE to an immutable GHCR image tag}
    restart: unless-stopped
    command: celery -A content_pilot.tasks.celery_app:celery_app worker --loglevel=INFO --concurrency=${CELERY_WORKER_CONCURRENCY:-1}
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Samara}
      POSTGRES_HOST: ${POSTGRES_HOST:-content-pilot-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the server-side env file}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the server-side env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the server-side env file}
      REDIS_HOST: ${REDIS_HOST:-content-pilot-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      CELERY_DISPATCH_INTERVAL_SECONDS: ${CELERY_DISPATCH_INTERVAL_SECONDS:-60}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
      PUBLICATION_MAX_RETRIES: ${PUBLICATION_MAX_RETRIES:-3}
      PUBLICATION_RETRY_BASE_SECONDS: ${PUBLICATION_RETRY_BASE_SECONDS:-30}
      PUBLISHING_DRY_RUN: ${PUBLISHING_DRY_RUN:-false}
      SOCIAL_HTTP_TIMEOUT_SECONDS: ${SOCIAL_HTTP_TIMEOUT_SECONDS:-30}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_GATEWAY_BASE_URL: ${TELEGRAM_GATEWAY_BASE_URL:-}
      CONTENTPILOT_GATEWAY_KEY: ${CONTENTPILOT_GATEWAY_KEY:-}
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:-}
      VK_GROUP_ID: ${VK_GROUP_ID:-}
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
      MEDIA_ROOT: /app/data/media
    depends_on:
      content-pilot-db: {condition: service_healthy}
      content-pilot-redis: {condition: service_healthy}
    volumes:
      - content-pilot-prod-media:/app/data/media:ro
    networks: [content-pilot-prod-network]

  content-pilot-beat:
    image: ${CONTENT_PILOT_IMAGE:?set CONTENT_PILOT_IMAGE to an immutable GHCR image tag}
    restart: unless-stopped
    command: celery -A content_pilot.tasks.celery_app:celery_app beat --loglevel=INFO
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Samara}
      POSTGRES_HOST: ${POSTGRES_HOST:-content-pilot-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the server-side env file}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the server-side env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the server-side env file}
      REDIS_HOST: ${REDIS_HOST:-content-pilot-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      CELERY_DISPATCH_INTERVAL_SECONDS: ${CELERY_DISPATCH_INTERVAL_SECONDS:-60}
      PUBLICATION_MAX_RETRIES: ${PUBLICATION_MAX_RETRIES:-3}
      PUBLICATION_RETRY_BASE_SECONDS: ${PUBLICATION_RETRY_BASE_SECONDS:-30}
      PUBLISHING_DRY_RUN: ${PUBLISHING_DRY_RUN:-false}
    depends_on:
      content-pilot-db: {condition: service_healthy}
      content-pilot-redis: {condition: service_healthy}
    networks: [content-pilot-prod-network]

volumes:
  content-pilot-prod-postgres-data:
    name: ${CONTENT_PILOT_POSTGRES_VOLUME:-content-pilot-prod-postgres-data}
  content-pilot-prod-media:
    name: ${CONTENT_PILOT_MEDIA_VOLUME:-content-pilot-prod-media}

networks:
  content-pilot-prod-network:
    name: ${CONTENT_PILOT_NETWORK:-content-pilot-prod-network}
