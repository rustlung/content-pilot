services:
  content-pilot-db:
    image: postgres:16-alpine
    container_name: content-pilot-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-content_pilot}
      POSTGRES_USER: ${POSTGRES_USER:-content_pilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - content-pilot-postgres-data:/var/lib/postgresql/data
    networks:
      - content-pilot-network

  content-pilot-redis:
    image: redis:7-alpine
    container_name: content-pilot-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - content-pilot-network

  content-pilot-api:
    build: .
    container_name: content-pilot-api
    environment:
      APP_NAME: ${APP_NAME:-ContentPilot}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Samara}
      POSTGRES_HOST: content-pilot-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-content_pilot}
      POSTGRES_USER: ${POSTGRES_USER:-content_pilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      REDIS_HOST: content-pilot-redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      CELERY_DISPATCH_INTERVAL_SECONDS: ${CELERY_DISPATCH_INTERVAL_SECONDS:-60}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
      PUBLICATION_MAX_RETRIES: ${PUBLICATION_MAX_RETRIES:-3}
      PUBLICATION_RETRY_BASE_SECONDS: ${PUBLICATION_RETRY_BASE_SECONDS:-30}
      PUBLISHING_DRY_RUN: ${PUBLISHING_DRY_RUN:-false}
      SOCIAL_HTTP_TIMEOUT_SECONDS: ${SOCIAL_HTTP_TIMEOUT_SECONDS:-30}
      PROXYAPI_API_KEY: ${PROXYAPI_API_KEY:-}
      PROXYAPI_BASE_URL: ${PROXYAPI_BASE_URL:-https://api.proxyapi.ru/v1}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-openai/gpt-4.1-mini}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-openai/gpt-image-1-mini}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      MEDIA_ROOT: /app/data/media
    command: uvicorn content_pilot.app:create_app --factory --host 0.0.0.0 --port 8000 --reload
    depends_on:
      content-pilot-db:
        condition: service_healthy
    ports:
      - "8002:8000"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      - content-pilot-media:/app/data/media
    networks:
      - content-pilot-network

  content-pilot-worker:
    build: .
    container_name: content-pilot-worker
    command: celery -A content_pilot.tasks.celery_app:celery_app worker --loglevel=INFO --concurrency=${CELERY_WORKER_CONCURRENCY:-1}
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: content-pilot-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-content_pilot}
      POSTGRES_USER: ${POSTGRES_USER:-content_pilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      REDIS_HOST: content-pilot-redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      CELERY_DISPATCH_INTERVAL_SECONDS: ${CELERY_DISPATCH_INTERVAL_SECONDS:-60}
      PUBLICATION_MAX_RETRIES: ${PUBLICATION_MAX_RETRIES:-3}
      PUBLICATION_RETRY_BASE_SECONDS: ${PUBLICATION_RETRY_BASE_SECONDS:-30}
      PUBLISHING_DRY_RUN: ${PUBLISHING_DRY_RUN:-false}
      SOCIAL_HTTP_TIMEOUT_SECONDS: ${SOCIAL_HTTP_TIMEOUT_SECONDS:-30}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:-}
      VK_GROUP_ID: ${VK_GROUP_ID:-}
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
      MEDIA_ROOT: /app/data/media
    depends_on:
      content-pilot-db: {condition: service_healthy}
      content-pilot-redis: {condition: service_healthy}
    volumes:
      - content-pilot-media:/app/data/media:ro
    networks: [content-pilot-network]

  content-pilot-beat:
    build: .
    container_name: content-pilot-beat
    command: celery -A content_pilot.tasks.celery_app:celery_app beat --loglevel=INFO
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: content-pilot-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-content_pilot}
      POSTGRES_USER: ${POSTGRES_USER:-content_pilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      REDIS_HOST: content-pilot-redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      CELERY_DISPATCH_INTERVAL_SECONDS: ${CELERY_DISPATCH_INTERVAL_SECONDS:-60}
      PUBLICATION_MAX_RETRIES: ${PUBLICATION_MAX_RETRIES:-3}
      PUBLICATION_RETRY_BASE_SECONDS: ${PUBLICATION_RETRY_BASE_SECONDS:-30}
      PUBLISHING_DRY_RUN: ${PUBLISHING_DRY_RUN:-false}
    depends_on:
      content-pilot-db: {condition: service_healthy}
      content-pilot-redis: {condition: service_healthy}
    networks: [content-pilot-network]

volumes:
  content-pilot-postgres-data:
  content-pilot-media:

networks:
  content-pilot-network:
    name: content-pilot-network
