[project]
name = "content-pilot"
version = "0.1.0"
description = "Content planning and social publishing foundation"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "openai>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "redis>=5,<7",
    "python-multipart>=0.0.9,<1",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a running PostgreSQL instance"]
