<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script defer src="{{ url_for('static', path='js/app.js') }}"></script>
</head>
<body>
  <header class="site-header"><div class="shell nav">
    <a class="brand" href="/">ContentPilot</a>
    <nav aria-label="Основная навигация"><a href="/">Панель</a><a href="/projects">Проекты</a></nav>
    <span class="env">{{ app_env }}</span>
  </div></header>
  <main class="shell">
    {% if message %}<div class="flash flash-{{ message_type }}" role="status">{{ message }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
