{% extends "base.html" %}{% block title %}Новый проект — {{ app_name }}{% endblock %}{% block content %}
<section class="narrow"><p class="eyebrow">Новый проект</p><h1>Создать проект</h1><form method="post" action="/projects" class="panel form-grid"><label>Название<input name="name" required maxlength="255" autofocus></label><label>Язык<input name="language" value="ru" required maxlength="16"></label><label class="full">Описание<textarea name="description" rows="4" placeholder="Например: Python backend, AI-автоматизация и инженерные решения"></textarea></label><label class="full">Аудитория<textarea name="audience" rows="3"></textarea></label><label class="full">Tone of voice<textarea name="tone_of_voice" rows="3" placeholder="Профессиональный, практичный, понятный"></textarea></label><div class="full actions"><a class="button button-secondary" href="/projects">Отмена</a><button class="button" type="submit">Создать проект</button></div></form></section>
{% endblock %}
